<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Prompt Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>AI Prompt Generator</h1>
            <p>Buat prompt AI semudah Itu</p>
        </header>
        
        <main>
            <div class="chat-container">
                <div class="chat-display" id="chatDisplay">
                    <!-- Pesan akan muncul di sini -->
                </div>
                
                <div class="input-area">
                    <textarea id="userInput" placeholder="Ketik prompt Anda di sini..."></textarea>
                    <button id="sendButton">Kirim</button>
                    <button id="clearButton">Bersihkan</button>
                </div>
            </div>

            <select id="modelSelector">
                <option value="mistralai/mistral-7b-instruct">Mistral 7B Instruct</option>
                <option value="google/gemma-7b-it">Google Gemma 7B</option>
                <option value="nousresearch/nous-capybara-7b">Nous Capybara 7B</option>
                <option value="gryphe/mythomist-7b">MythoMist 7B</option>
                <option value="openchat/openchat-7b">OpenChat 7B</option>
                <option value="stanford/alpaca-7b">Alpaca 7B</option>
                <option value="meta-llama/llama-2-13b-chat">LLaMA 2 13B Chat</option>
            </select>
            
            <div class="prompt-suggestions">
                <h3>Contoh Prompt:</h3>
                <div class="suggestion-buttons">
                    <button class="suggestion-btn">Jelaskan konsep machine learning dengan sederhana</button>
                    <button class="suggestion-btn">Bantu saya menulis email profesional</button>
                    <button class="suggestion-btn">Buatkan kode HTML untuk form login</button>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
